name: Release Neutree HAMi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: HAMi source branch, tag, or commit to build
        required: true
        default: master
        type: string
      image_tag:
        description: Tag to publish to docker.io/neutree/hami
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-neutree-hami-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/neutree/hami
  # VERSION also selects the versioned library from the existing core image.
  HAMI_VERSION: v2.10.0
  HAMICORE_IMAGE: docker.io/projecthami/hamicore:v2.10.0@sha256:66d447de8127f5600ab153673894a42a6d740faa42129528b0e44bd81d8bfda3

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag must be a valid Docker tag of at most 128 characters"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Read build inputs
        id: source
        run: |
          grep '^GOLANG_IMAGE=' version.mk >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile
        run: make lint_dockerfile

      - name: Docker Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ inputs.image_tag }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Build and push hami image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.hamimaster
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.HAMI_VERSION }}
            GOLANG_IMAGE=${{ env.GOLANG_IMAGE }}
            HAMICORE_IMAGE=${{ env.HAMICORE_IMAGE }}
            DEST_DIR=/usr/local
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign hami image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
